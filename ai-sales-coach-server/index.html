<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 맞춤형 세일즈 코칭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#141a2e;--sub:#5d667d;--line:#e3e7f0;--main:#0a35d1;--soft:#eaf0ff;--acc:#0a35d1}
body.sonhae{--main:#0a7a3c;--soft:#e7f8ee;--acc:#0a7a3c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 4px;font-weight:900;letter-spacing:-.02em}
.lead{color:var(--sub);margin:0 0 22px}
.tabs{display:flex;gap:10px;margin-bottom:18px}
.tab{flex:0 0 auto;padding:11px 30px;border-radius:999px;border:2px solid #9aa2b5;background:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.tab[aria-selected=true]{background:var(--main);border-color:var(--main);color:#fff}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.nav{display:flex;flex-direction:column;gap:8px}
.nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.nav button[aria-current=true]{background:var(--soft);border-color:var(--main);box-shadow:inset 4px 0 0 var(--main)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}
.panel h2{margin:0 0 14px;font-size:24px}
.lbl{font-size:13px;font-weight:700;color:var(--sub);margin:0 0 6px}
.pitch{background:var(--soft);border-left:5px solid var(--main);padding:16px 18px;border-radius:6px;font-size:19px;font-weight:700;color:var(--main);margin:0 0 20px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:22px}
.two p{margin:0;font-size:15px}
hr{border:0;border-top:1px solid var(--line);margin:4px 0 20px}
.coach-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.coach-h b{font-size:17px}
.badge{font-size:12px;font-weight:700;color:#7a3ff0;background:#f0e8ff;padding:3px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.w2{grid-column:span 2}.f.w4{grid-column:span 4}
.f label{font-size:12.5px;font-weight:700;color:var(--sub)}
input,select,textarea{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:#8a4bf0;box-shadow:0 0 0 3px #8a4bf033}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.go{flex:1;min-width:220px;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#9333ea,#4f46e5);color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.ghost{padding:14px 18px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:600 14px inherit;font-family:inherit;cursor:pointer;color:var(--sub)}
details.set{margin-top:14px;font-size:14px;color:var(--sub)}
details.set summary{cursor:pointer;font-weight:600}
.setg{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:10px}
.note{font-size:12.5px;margin:6px 0 0}
#out{margin-top:22px}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 0;color:var(--sub)}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #e9defc;border-top-color:#7c3aed;border-right-color:#4f46e5;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.dots::after{content:'';animation:dt 1.4s steps(4) infinite}
@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.res{display:flex;flex-direction:column;gap:16px}
.blk{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.blk>h3{margin:0;padding:12px 18px;font-size:16px;background:var(--soft);color:var(--main);display:flex;justify-content:space-between;align-items:center}
.blk .in{padding:16px 18px}
.script{font-size:16.5px;line-height:1.85;white-space:pre-wrap;margin:0}
.tip{margin:12px 0 0;padding:10px 14px;background:#fff8e6;border-radius:10px;font-size:14px}
.obj{padding:16px 18px;border-top:1px solid var(--line)}
.obj:first-of-type{border-top:0}
.q{font-weight:700;font-size:15.5px;margin:0 0 8px;display:flex;gap:8px}
.q::before{content:'거절';flex:none;font-size:12px;background:#fde8e8;color:#c0262d;border-radius:6px;padding:1px 8px;height:22px;margin-top:2px}
.a{margin:0;background:#f6f8fc;border-radius:10px;padding:12px 14px;font-size:15.5px;line-height:1.8;white-space:pre-wrap}
.fu{margin:8px 0 0;font-size:13.5px;color:var(--sub)}
ul.pts{margin:0;padding-left:20px}ul.pts li{margin:4px 0}
.cp{border:0;background:#fff;color:var(--main);font:600 12px inherit;font-family:inherit;padding:4px 10px;border-radius:999px;cursor:pointer}
.err{background:#fdecec;color:#a5171e;padding:14px 18px;border-radius:12px;font-size:14.5px}
.disc{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
button:focus-visible{outline:3px solid #8a4bf0;outline-offset:2px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{flex-direction:row;overflow-x:auto}.nav button{flex:none}.two{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.f.w2,.f.w4{grid-column:span 2}.setg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 맞춤형 세일즈 코칭</h1>
  <p class="lead">고객 정보를 입력하면 바로 쓸 수 있는 오프닝 스크립트와 거절 극복 화법을 만들어 드립니다.</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="saengbo" aria-selected="true">생명보험</button>
    <button class="tab" role="tab" data-t="sonhae" aria-selected="false">손해보험</button>
  </div>
  <div class="layout">
    <div class="nav" id="nav"></div>
    <section class="panel">
      <h2 id="ttl"></h2>
      <div class="lbl">현장 활용 멘트 (PITCH)</div>
      <p class="pitch" id="pitch"></p>
      <div class="two">
        <div><div class="lbl">핵심 포인트</div><p id="pt"></p></div>
        <div><div class="lbl">주요 타겟층</div><p id="tg"></p></div>
      </div>
      <hr>
      <div class="coach-h"><b>✨ AI 맞춤형 세일즈 코칭</b><span class="badge">Gemini API</span></div>
      <div class="grid">
        <div class="f"><label for="gender">성별</label><select id="gender"><option value="">선택 안 함</option><option>남성</option><option>여성</option></select></div>
        <div class="f"><label for="age">나이</label><input id="age" type="number" min="0" max="100" placeholder="예: 38"></div>
        <div class="f"><label for="job">직업</label><input id="job" placeholder="예: 초등학교 교사"></div>
        <div class="f"><label for="income">연봉</label><input id="income" placeholder="예: 5,500만원"></div>
        <div class="f"><label for="mbti">MBTI</label><input id="mbti" maxlength="4" placeholder="예: ISTJ" style="text-transform:uppercase"></div>
        <div class="f w2"><label for="family">가족관계</label><input id="family" placeholder="예: 기혼, 자녀 2명(7세·4세), 맞벌이"></div>
        <div class="f"><label for="hist">병력·건강</label><input id="hist" placeholder="예: 고혈압 약 복용"></div>
        <div class="f w4"><label for="etc">기타 (미래계획·성향·기존 가입 보험 등)</label><textarea id="etc" placeholder="예: 3년 내 내 집 마련 계획, 기존 종신보험 1건 보유, 보험료 부담에 민감"></textarea></div>
      </div>
      <div class="row">
        <button class="go" id="go">✨ 맞춤 화법 및 거절 극복 스크립트 생성</button>
        <button class="ghost" id="sample" type="button">예시 채우기</button>
        <button class="ghost" id="clear" type="button">초기화</button>
      </div>
      <details class="set" id="setd">
        <summary>접속 코드 (관리자에게 받은 경우)</summary>
        <div class="setg" style="grid-template-columns:1fr">
          <div class="f"><label for="pass">접속 코드</label><input id="pass" type="password" autocomplete="off" placeholder="접속 코드가 없으면 비워 두세요"></div>
        </div>
      </details>
      <div id="out" aria-live="polite"></div>
      <p class="disc">AI가 만든 화법은 참고용입니다. 상품 안내 시 설명의무·고지의무 등 회사 심의 기준을 반드시 확인하세요.</p>
    </section>
  </div>
</div>
<script>
const DATA={
saengbo:{name:'생명보험',items:[
{i:'💰',n:'자산관리형 종신',p:'이 보험은 단순한 지출이 아닌, 가족을 지키는 \'평생 비상금 통장\'입니다.',k:'기존 종신보험을 \'현금흐름 설계\'로 포지셔닝 전환. 해지환급금 및 연금 전환 기능 적극 활용.',t:'안정적 현금흐름이 필요한 중산층 이상'},
{i:'👨‍👩‍👧',n:'가족 리스크 패키지',p:'내가 없어도 우리 아이가 계획한 대로 자랄 수 있게, 가장의 빈자리를 미리 채워두는 설계입니다.',k:'사망·소득중단 리스크를 가족 단위로 묶어 필요 보장액을 산출하고 생활비 기준으로 설명.',t:'자녀가 어리고 외벌이 또는 소득 의존도가 높은 가정'},
{i:'🔄',n:'보장 리모델링',p:'해약이 아니라 지금 보험을 지금 삶에 맞게 다시 맞추는 점검입니다.',k:'가입 시점 이후 달라진 소득·가족·건강 상태를 기준으로 중복·공백 보장 진단. 해약 유도 금지, 유지·조정 중심.',t:'가입 5년 이상 경과, 보장 내용을 잘 모르는 기존 고객'},
{i:'🏛️',n:'세금 + 상속 설계',p:'물려주는 것만큼 중요한 건, 물려줄 때 필요한 현금을 미리 마련해 두는 것입니다.',k:'상속·증여 시 세금 재원 마련과 수익자 지정 구조를 안내. 세법 세부는 전문가 검토 필수.',t:'부동산·사업체 등 비유동자산 비중이 큰 자산가, 자영업자'}]},
sonhae:{name:'손해보험',items:[
{i:'🛡️',n:'건강보험 풀세트',p:'어떤 병에 걸려도 \'내 돈 한 푼 안 드는 병원비 플랜\'을 제안합니다.',k:'암+뇌+심장+수술비 등 핵심 진단비와 실손보험을 패키지로 구성하여 의료비 리스크 전면 차단.',t:'보장의 기초가 없거나 갱신 폭탄이 걱정되는 고객'},
{i:'🩺',n:'유병자 집중 공략',p:'병력이 있어도 가입할 수 있는 길은 있습니다. 조건에 맞는 상품부터 찾아드립니다.',k:'간편심사·유병자 상품의 가입 조건, 보험료, 보장 범위를 비교 설명. 고지의무를 정확히 안내.',t:'고혈압·당뇨 등 치료 이력으로 가입이 막혔던 고객'},
{i:'🚗',n:'단기 니즈 확장',p:'자동차·운전자·여행처럼 지금 당장 필요한 보험이 장기 상담의 문을 여는 가장 자연스러운 시작입니다.',k:'갱신 시점·구매 시점 니즈로 접점 확보 후 건강·연금 상담으로 자연스럽게 확장.',t:'사회초년생, 신규 차량 구매·해외여행 예정 고객'},
{i:'📊',n:'데이터 맞춤 설계',p:'평균이 아니라 고객님의 나이·직업·생활 데이터에 맞춘 설계입니다.',k:'연령·직업·가족·기존 계약 데이터를 근거로 필요한 담보와 보험료 수준을 수치로 제시.',t:'비교·분석을 중시하는 꼼꼼한 고객(주로 T 성향)'}]}
};
const $=id=>document.getElementById(id);
let tab='saengbo',idx=0;
function renderPanel(){
  document.body.className=tab==='sonhae'?'sonhae':'';
  const d=DATA[tab];
  $('nav').replaceChildren(...d.items.map((s,n)=>{const b=document.createElement('button');b.textContent=s.i+' '+s.n;if(n===idx)b.setAttribute('aria-current','true');b.onclick=()=>{idx=n;renderPanel()};return b}));
  const s=d.items[idx];
  $('ttl').textContent=s.i+' '+s.n;$('pitch').textContent='"'+s.p+'"';$('pt').textContent=s.k;$('tg').textContent='🎯 '+s.t;
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;idx=0;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));renderPanel()});
renderPanel();

try{$('pass').value=localStorage.getItem('pc')||''}catch(e){}

const F=['gender','age','job','income','mbti','family','hist','etc'];
$('sample').onclick=()=>{const v={gender:'여성',age:'38',job:'초등학교 교사',income:'5,500만원',mbti:'ISTJ',family:'기혼, 자녀 2명(7세·4세), 남편은 회사원',hist:'특이사항 없음',etc:'3년 내 내 집 마련 계획. 공무원연금 외 개인 보장은 실손보험뿐. 보험료 대비 효과를 꼼꼼히 따지는 편'};F.forEach(k=>$(k).value=v[k])};
$('clear').onclick=()=>{F.forEach(k=>$(k).value='');$('out').replaceChildren()};

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function copyBtn(get){const b=el('button','cp','복사');b.onclick=async()=>{try{await navigator.clipboard.writeText(get());b.textContent='복사됨 ✓'}catch(e){b.textContent='복사 실패'}setTimeout(()=>b.textContent='복사',1500)};return b}

function buildPrompt(){
  const d=DATA[tab],s=d.items[idx];
  const lab={gender:'성별',age:'나이',job:'직업',income:'연봉',mbti:'MBTI',family:'가족관계',hist:'병력·건강',etc:'기타'};
  const cust=F.filter(k=>$(k).value.trim()).map(k=>`- ${lab[k]}: ${$(k).value.trim()}`).join('\n')||'- (입력된 정보 없음: 일반적인 고객을 가정)';
  return `[보험 구분] ${d.name}
[선택 전략] ${s.n}
[전략 대표 멘트] ${s.p}
[전략 핵심 포인트] ${s.k}
[주요 타겟층] ${s.t}

[고객 정보]
${cust}

위 전략을 이 고객에게 적용하는 상담 상황을 시뮬레이션하세요. 고객의 나이·직업·가족·MBTI 성향(말투와 설득 방식)·병력을 실제로 반영해 다음 JSON으로만 답하세요.
{"opening":{"script":"첫 만남 또는 첫 통화에서 자연스럽게 꺼낼 오프닝 스크립트. 설계사와 고객의 대화가 오가는 형식(설계사:/고객: 예상 반응)으로 6~10줄","tip":"이 고객에게 이 오프닝이 통하는 이유와 말투·태도 팁 1~2문장"},"objections":[{"objection":"이 고객이 실제로 할 법한 거절 한마디","response":"바로 쓸 수 있는 극복 화법 3~5문장(공감 → 재질문 → 근거 → 다음 행동 제안)","followup":"고객이 다시 반응할 때 이어갈 한 줄"}],"points":["이 고객 공략 포인트 3~4개"],"cautions":["불완전판매 방지를 위한 유의사항 2~3개(설명의무, 고지의무, 과장·단정 표현 금지, 병력이 있다면 고지 관련 안내)"]}
objections는 정확히 4개. 한국어 구어체, 과장·수익 보장·타사 비방 금지.`;
}
const SYS='당신은 한국 보험 시장에 정통한 15년차 세일즈 코치입니다. 금융소비자보호법과 보험 판매 윤리를 지키며, 설계사가 현장에서 그대로 읽어도 어색하지 않은 자연스러운 구어체 화법을 제공합니다. 특정 상품명·수익률·보험료를 지어내지 않습니다.';

async function call(prompt){
  const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,system:SYS,passcode:$('pass').value.trim()})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    const e=new Error(r.status===429?'Gemini 사용량 한도에 도달했습니다. 잠시 뒤 다시 시도해 주세요.':r.status===401?'접속 코드가 올바르지 않습니다. 아래 접속 코드를 확인해 주세요.':(j.error||('HTTP '+r.status)));
    e.status=r.status;throw e}
  if(!j.text)throw new Error('응답이 비어 있습니다. 입력 내용을 바꿔 다시 시도해 주세요.');
  return JSON.parse(j.text.replace(/```json|```/g,'').trim());
}

function render(r){
  const box=el('div','res');
  const o=r.opening||{};
  let b=el('div','blk'),h=el('h3',null,'🎬 오프닝 스크립트');h.append(copyBtn(()=>o.script));b.append(h);
  let i=el('div','in');i.append(el('p','script',o.script||''));if(o.tip)i.append(el('div','tip','💡 '+o.tip));b.append(i);box.append(b);
  b=el('div','blk');h=el('h3',null,'🛡️ 예상 거절 & 극복 화법');b.append(h);
  (r.objections||[]).forEach(x=>{const w=el('div','obj');const q=el('p','q','"'+x.objection+'"');const a=el('p','a',x.response);const bar=el('div');bar.style.cssText='display:flex;justify-content:flex-end;margin-top:4px';bar.append(copyBtn(()=>x.response));w.append(q,a);if(x.followup)w.append(el('p','fu','↳ 이어서: '+x.followup));w.append(bar);b.append(w)});box.append(b);
  const list=(ttl,arr)=>{const bb=el('div','blk');bb.append(el('h3',null,ttl));const ii=el('div','in');const u=el('ul','pts');(arr||[]).forEach(t=>u.append(el('li',null,t)));ii.append(u);bb.append(ii);return bb};
  box.append(list('🎯 공략 포인트',r.points),list('⚠️ 컴플라이언스 유의사항',r.cautions));
  return box;
}

$('go').onclick=async()=>{
  const out=$('out');
  try{localStorage.setItem('pc',$('pass').value.trim())}catch(e){}
  const ld=el('div','load');ld.append(el('div','spin'));ld.append(el('div','dots','고객 맞춤 화법을 만들고 있어요'));out.replaceChildren(ld);
  $('go').disabled=true;
  try{
    const r=await call(buildPrompt());
    out.replaceChildren(render(r));out.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    if(e.status===401)$('setd').open=true;
    out.replaceChildren(el('div','err','생성에 실패했습니다: '+(e instanceof SyntaxError?'응답 형식 오류입니다. 다시 시도해 주세요.':e instanceof TypeError?'서버에 연결하지 못했습니다. 배포된 주소(Netlify)에서 열었는지 확인해 주세요.':e.message)));
  }finally{$('go').disabled=false}
};
</script>
</body>
</html>
